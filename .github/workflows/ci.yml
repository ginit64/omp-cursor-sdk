name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --no-save
      - name: Typecheck against OMP types
        run: bun run typecheck:src
      - name: Port-relevant unit tests (Bun runtime)
        run: bun run test
